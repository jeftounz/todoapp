<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  {% load static %}
  <meta charset="utf-8">
  <title>{{title}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  <!-- Tu archivo CSS local -->
  <link rel="stylesheet" href="{% static 'styles.css' %}">
  <!-- jQuery y Bootstrap JS -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>

<body class="container-fluid">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-info">
        <strong>{{message}}</strong>
      </div>
    {% endfor %}
  {% endif %}

  <center class="row">
    <h1><i>__TODO LIST__</i></h1>
    <hr />
  </center>

  <div class="row">
    <div class="col-md-8">
      {% for i in list %}
        <div class="card">
          <center><b>{{i.title}}</b></center>
          <hr/>
          {{i.date}}
          <hr/>
          {{i.details}}
          <br /><br />
          <form action="{% url 'core:remove' i.id %}" method="POST" style="padding-right: 4%; padding-bottom: 3%;">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary" style="float: right;">
              <span class="glyphicon glyphicon-trash"></span> &nbsp; remove
            </button>
          </form>
        </div>
      {% endfor %}
    </div>

    <div class="col-md-1"></div>

    <div class="col-md-3">
      <div class="submit_form">
        <form method="POST">
          {% csrf_token %}
          {{forms}}
          <center>
            <input type="submit" class="btn btn-default" value="submit" />
          </center>
        </form>
      </div>
    </div>
  </div>

  <!-- Ejemplo para futuras imágenes en media/ -->
  {# <img src="{{ MEDIA_URL }}logo.png" class="img-responsive" alt="Logo"> #}
</body>
</html>
